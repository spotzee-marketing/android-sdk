name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.repository_owner == 'spotzee-marketing'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify external actions are pinned
        run: sh scripts/check-actions-pinned.sh

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build SDK
        run: ./gradlew :core:build

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Installation

            Add JitPack repository to your settings.gradle:
            ```gradle
            dependencyResolutionManagement {
                repositories {
                    maven { url 'https://jitpack.io' }
                }
            }
            ```

            Add the dependency:
            ```gradle
            implementation 'com.github.spotzee-marketing:android-sdk:${{ github.ref_name }}'
            ```

            ## What's Changed
            See the [full changelog](https://github.com/spotzee-marketing/android-sdk/compare/${{ github.ref_name }}...HEAD)
          draft: false
          prerelease: false
          files: |
            core/build/outputs/aar/*.aar
